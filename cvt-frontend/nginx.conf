server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression pour les assets statiques
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        # Fallback SPA : toute route inconnue renvoie index.html
        # pour laisser Angular Router gérer le routing côté client.
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache longue durée des assets versionnés (hash dans le nom).
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
