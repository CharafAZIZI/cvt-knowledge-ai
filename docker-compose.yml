services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cvt-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: unless-stopped


  auth-service:
    build:
      context: ./AuthService/AuthService
      dockerfile: Dockerfile

    container_name: cvt-auth-service

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CVTAuthDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      Jwt__Key: "CVT_Auth_Service_Super_Secret_Key_2026_Change_This_To_A_Long_Random_Value"
      Jwt__Issuer: "CVTAuthService"
      Jwt__Audience: "CVTAdministration"
      Jwt__ExpirationMinutes: "120"

    ports:
      - "5280:8080"

    depends_on:
      - sqlserver

    restart: unless-stopped


  minio:
    image: minio/minio:latest
    container_name: cvt-minio

    environment:
      MINIO_ROOT_USER: "cvtadmin"
      MINIO_ROOT_PASSWORD: "CvtMinioPassword123!"

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web (login avec MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)

    volumes:
      - minio_data:/data

    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    container_name: cvt-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped


  ai-service:
    build:
      context: ./AiService
      dockerfile: Dockerfile

    container_name: cvt-ai-service

    environment:
      AI_OLLAMA_BASE_URL: "http://ollama:11434"
      AI_OLLAMA_MODEL: "llama3.2:3b"
      AI_CHROMA_PERSIST_DIR: "/data/chroma"

    volumes:
      - chroma_data:/data/chroma
      - ai_model_cache:/root/.cache
      - ai_history_data:/data/history

    ports:
      - "5100:8000"

    depends_on:
      - ollama

    restart: unless-stopped


  document-service:
    build:
      context: ./DocumentService/DocumentService
      dockerfile: Dockerfile

    container_name: cvt-document-service

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DocumentDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      Jwt__Key: "CVT_Auth_Service_Super_Secret_Key_2026_Change_This_To_A_Long_Random_Value"
      Jwt__Issuer: "CVTAuthService"
      Jwt__Audience: "CVTAdministration"

      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "cvtadmin"
      Minio__SecretKey: "CvtMinioPassword123!"
      Minio__BucketName: "cvt-documents"
      Minio__UseSSL: "false"
      Minio__TimeoutSeconds: "60"

      AiService__BaseUrl: "http://ai-service:8000"

    ports:
      - "5000:8080"

    depends_on:
      - sqlserver
      - minio
      - ai-service

    restart: unless-stopped


  api-gateway:
    build:
      context: ./ApiGateway/ApiGateway
      dockerfile: Dockerfile

    container_name: cvt-api-gateway

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

    ports:
      - "8080:8080"

    depends_on:
      - auth-service
      - document-service
      - ai-service

    restart: unless-stopped


  frontend:
    build:
      context: ./cvt-frontend
      dockerfile: Dockerfile

    container_name: cvt-frontend

    ports:
      - "4200:80"

    depends_on:
      - api-gateway

    restart: unless-stopped


volumes:

  sqlserver_data:
  minio_data:
  ollama_data:
  chroma_data:
  ai_model_cache:
  ai_history_data: