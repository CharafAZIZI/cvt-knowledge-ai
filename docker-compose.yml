services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cvt-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: unless-stopped


  auth-service:
    build:
      context: ./AuthService/AuthService
      dockerfile: Dockerfile

    container_name: cvt-auth-service

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CVTAuthDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      Jwt__Key: "CVT_Auth_Service_Super_Secret_Key_2026_Change_This_To_A_Long_Random_Value"
      Jwt__Issuer: "CVTAuthService"
      Jwt__Audience: "CVTAdministration"
      Jwt__ExpirationMinutes: "120"

    ports:
      - "5280:8080"

    depends_on:
      - sqlserver

    restart: unless-stopped


  document-service:
    build:
      context: ./DocumentService/DocumentService
      dockerfile: Dockerfile

    container_name: cvt-document-service

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DocumentDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

      Jwt__Key: "CVT_Auth_Service_Super_Secret_Key_2026_Change_This_To_A_Long_Random_Value"
      Jwt__Issuer: "CVTAuthService"
      Jwt__Audience: "CVTAdministration"

    ports:
      - "5000:8080"

    depends_on:
      - sqlserver

    restart: unless-stopped


  api-gateway:
    build:
      context: ./ApiGateway/ApiGateway
      dockerfile: Dockerfile

    container_name: cvt-api-gateway

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

    ports:
      - "8080:8080"

    depends_on:
      - auth-service
      - document-service

    restart: unless-stopped


volumes:

  sqlserver_data: